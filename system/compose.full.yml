# Application stack with a separately privileged, TLS-authenticated test daemon.
name: semflow-container

x-app: &app
  image: semflow-audit:container-v1
  platform: linux/amd64
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      NODE_IMAGE: ${IMAGE_REGISTRY:-docker.io}/library/node:22.22.0-bookworm-slim@sha256:7cc56ef285a8568121537d17b05e72128f01b89c54607b51acf084a50ef483f3
      PYTHON_IMAGE: ${IMAGE_REGISTRY:-docker.io}/library/python:3.14.0-slim-bookworm@sha256:9bbb8720ae0a24a6ca8dd678bfdf57818fe70caf54c52a53ec01d8db43405056
      DOCKER_CLI_IMAGE: ${IMAGE_REGISTRY:-docker.io}/library/docker:28.5.2-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
  env_file: ../.env.docker
  environment:
    PROJECT_NAME: SemFlow Audit
    FASTAPI_ENV: development
    DATABASE_URL: postgresql+psycopg://audit:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/audit
    REDIS_URL: redis://redis:6379/0
    FRONTEND_HOST: http://localhost:${APP_PORT:-5181}
    ARTIFACT_ROOT: /app/artifacts
    CODEQL_PACK_PATH: /opt/packs
    CODEQL_BIN: /opt/codeql/codeql
    CODEQL_PYTHON_BIN: python3.11
    PYTHON_QUERY_PACK: codeql/python-queries@1.6.0
    JAVASCRIPT_QUERY_PACK: codeql/javascript-queries@1.4.0
    EMBEDDING_MODEL: ""
    EMBEDDING_REVISION: ""
    EMBEDDING_DIMENSIONS: "0"
    DOCKER_HOST: tcp://validator:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  volumes:
    - artifacts:/app/artifacts
    - validator-certs:/certs/client:ro

services:
  validator:
    image: ${IMAGE_REGISTRY:-docker.io}/library/docker:28.5.2-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:validator
    volumes:
      - validator-data:/var/lib/docker
      - validator-certs:/certs/client
      - artifacts:/app/artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'DOCKER_HOST=tcp://127.0.0.1:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client docker info >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
  validator-init:
    <<: *app
    command: [python, /app/system/docker/bootstrap_validator.py]
    environment:
      DOCKER_HOST: tcp://validator:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io}
    depends_on:
      validator: {condition: service_healthy}
  db:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: audit
      POSTGRES_DB: audit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes: [database:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U audit -d audit]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: [redis-server, --appendonly, "yes"]
    volumes: [queue:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  init:
    <<: *app
    command: [python, /app/system/docker/bootstrap.py]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  api:
    <<: *app
    ports: ["127.0.0.1:${APP_PORT:-5181}:8000"]
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
      validator-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/utils/health-check/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
  worker:
    <<: *app
    command: [celery, -A, app.jobs.celery_app:celery_app, worker, --pool=solo, --concurrency=1, --loglevel=INFO]
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
      validator-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "celery -A app.jobs.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 10

volumes:
  database:
  queue:
  artifacts:
  validator-data:
  validator-certs:
