[project]
name = "semflow-research"
version = "0.1.0"
description = "Platform-independent SemFlow research kernels and execution ports"
requires-python = ">=3.14,<4.0"
dependencies = [
    "semflow-contracts==0.1.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "openai==3.24.0",
    "haystack-ai==3.3.0",
    "PyYAML==6.0.3",
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "astroid==4.3.3",
]

[tool.uv.sources]
semflow-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semflow_research"]
