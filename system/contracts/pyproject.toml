[project]
name = "semflow-contracts"
version = "0.1.0"
description = "Versioned, platform-independent SemFlow research contracts"
requires-python = ">=3.14,<4.0"
dependencies = ["pydantic==2.13.4"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semflow_contracts"]
