[dependency-groups]
dev = [
    "prek>=0.4.14,<1.0.0",
    "typer>=0.27.1,<1.0.0",
    "zizmor>=1.29.0",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["backend", "contracts", "research", "research_cli"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.pytest.ini_options]
testpaths = ["tests", "contracts/tests", "research/tests", "research_cli/tests"]
pythonpath = [".", "..", "backend", "contracts/src", "research/src", "research_cli/src", "contracts/tests"]
markers = ["integration: requires actual CodeQL and Docker; enable AUDIT_RUN_REAL_TOOLS=1"]
